name: Release

on:
  push:
    branches: [ "master" ]

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Run Tests
      run: dotnet test

  validate:
    name: Validate Version & Release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Get Version from csproj
      id: get_version
      shell: pwsh
      run: |
        $csprojContent = Get-Content SuketAutoReplayUploader.csproj
        $versionMatch = $csprojContent | Select-String '<Version>(.*)</Version>'
        if ($versionMatch) {
            $projectVersion = $versionMatch.Matches.Groups[1].Value
            Write-Host "Found version: $projectVersion"
            echo "VERSION=$projectVersion" >> $env:GITHUB_OUTPUT
        } else {
            Write-Error "Could not find <Version> in csproj"
            exit 1
        }

    - name: Check if release already exists
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "v${{ steps.get_version.outputs.VERSION }}"
        Write-Host "Checking if release $tag already exists..."
        $releaseExists = gh release view $tag 2>$null | Out-String
        if ($LASTEXITCODE -eq 0) {
            Write-Error "A release for $tag already exists! Please update the version in the csproj and push again."
            exit 1
        }
        Write-Host "Release $tag does not exist. Proceeding."

  build_and_package:
    name: Build & Package
    needs: [test, validate]
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish
      run: dotnet publish SuketAutoReplayUploader.csproj -p:PublishProfile=Properties/PublishProfiles/SingleFileProfile.pubxml

    - name: Generate Installer Script
      shell: pwsh
      run: |
        $version = "${{ needs.validate.outputs.version }}"
        $issContent = @"
        [Setup]
        AppName=AutoReplayUploaderSA
        AppVersion=$version
        AppPublisher=Suket
        DefaultDirName={localappdata}\AutoReplayUploaderSA
        DefaultGroupName=AutoReplayUploaderSA
        DisableDirPage=no
        DisableProgramGroupPage=no
        OutputDir=Output
        OutputBaseFilename=AutoReplayUploaderSA_Setup
        Compression=lzma
        SolidCompression=yes
        PrivilegesRequired=lowest
        ArchitecturesAllowed=x64
        ArchitecturesInstallIn64BitMode=x64

        [Tasks]
        Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

        [Files]
        Source: "bin\Release\net10.0-windows\publish\win-x64\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

        [Icons]
        Name: "{group}\AutoReplayUploaderSA"; Filename: "{app}\SuketAutoReplayUploader.exe"
        Name: "{autodesktop}\AutoReplayUploaderSA"; Filename: "{app}\SuketAutoReplayUploader.exe"; Tasks: desktopicon

        [Run]
        Filename: "{app}\SuketAutoReplayUploader.exe"; Description: "{cm:LaunchProgram,AutoReplayUploaderSA}"; Flags: nowait postinstall skipifsilent
        "@
        Set-Content -Path "installer.iss" -Value $issContent

    - name: Compile Installer
      run: |
        choco install innosetup
        iscc installer.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer-executable
        path: Output/AutoReplayUploaderSA_Setup.exe

  release:
    name: Create GitHub Release
    needs: [validate, build_and_package]
    runs-on: ubuntu-latest
    steps:
    - name: Download Installer Artifact
      uses: actions/download-artifact@v4
      with:
        name: installer-executable
        path: Output

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ needs.validate.outputs.version }}"
        name: "Release v${{ needs.validate.outputs.version }}"
        files: Output/AutoReplayUploaderSA_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
